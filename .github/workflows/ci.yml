name: CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx @electron/rebuild -f -w better-sqlite3
      - run: npm run typecheck
      - run: npm run build
      # Real ffmpeg (libass) for the e2e render test.
      - run: npm run setup:ffmpeg
      # Headless milestone smokes (M2-M7) under a virtual display.
      - name: Smoke harnesses
        run: |
          set -e
          F=test/fixtures
          run() {
            local mode="$1"
            ME_SMOKE="$mode" ME_YTDLP_FIXTURE=$F/ytdlp ME_DOWNLOAD_FIXTURE=$F/audio/sample.mp3 \
              ME_WHISPER_FIXTURE=$F/whisper/sample-words.json \
              xvfb-run -a node_modules/electron/dist/electron --no-sandbox out/main/main.js \
              | tee /tmp/out.txt
            grep -Eq "(SMOKE(_M[0-9])?|E2E)_OK" /tmp/out.txt
          }
          for m in 1 m3 m4 m5 m6 m7 e2e; do echo "== smoke $m =="; run "$m"; done
