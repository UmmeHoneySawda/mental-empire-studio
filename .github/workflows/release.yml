name: Release

# Tag a version (e.g. v0.1.0) to build + publish installers for all three OSes.
on:
  push:
    tags: ['v*']

# Let the default GITHUB_TOKEN create the Release + upload installers.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Downloads static ffmpeg + ffprobe (libass) and yt-dlp into resources/bin.
      # No OS package manager needed — fetch:bin pulls BtbN/evermeet static builds
      # so BOTH ffmpeg and ffprobe are guaranteed present in the installer.
      - name: Provision sidecars (yt-dlp + ffmpeg + ffprobe → resources/bin)
        run: npm run fetch:bin

      - name: Build + package + publish
        run: npm run dist -- --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing / notarization — populated only when the secrets exist;
          # absent → an unsigned installer is produced (still works).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
